trigger:
  branches:
    include:
      - dev
      - testing
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.12'
  # Azure Service Connection name configured in Azure DevOps Settings
  azureServiceConnection: 'Azure-AppService-Conn'
  
  # Matching the exact App Service names generated by Terraform
  devAppName: 'app-my-azure-testing-ground-dev'
  testAppName: 'app-my-azure-testing-ground-testing'
  prodAppName: 'app-my-azure-testing-ground-prod'

stages:

# ==========================================
# STAGE 1: PROVISION INFRASTRUCTURE (TERRAFORM)
# ==========================================
- stage: ProvisionInfra
  displayName: 'Terraform Provisioning'
  jobs:
  - job: TerraformJob
    displayName: 'Terraform Init, Plan, and Apply'
    steps:
    - task: TerraformInstaller@0
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - script: |
        echo "Determining environment configuration..."
        BRANCH_NAME="$(Build.SourceBranchName)"
        
        if [ "$BRANCH_NAME" == "main" ]; then
          TFVARS_FILE="prod.tfvars"
        elif [ "$BRANCH_NAME" == "testing" ]; then
          TFVARS_FILE="testing.tfvars"
        else
          TFVARS_FILE="dev.tfvars"
        fi
        
        echo "Using var file: $TFVARS_FILE"
        
        # Initialize Terraform (connects to remote state backend)
        terraform init
        
        # Validate syntax
        terraform validate
        
        # Plan and Apply infrastructure
        terraform plan -var-file="$TFVARS_FILE"
        terraform apply -var-file="$TFVARS_FILE" -auto-approve
      displayName: 'Terraform Init & Apply'
      env:
        # Pass Azure Credentials for Terraform Provider
        ARM_CLIENT_ID: $(AZURE_CLIENT_ID)
        ARM_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
        ARM_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
        ARM_TENANT_ID: $(AZURE_TENANT_ID)

# ==========================================
# STAGE 2: BUILD & TEST CODE
# ==========================================
- stage: BuildAndTest
  displayName: 'Build & Unit Test'
  dependsOn: ProvisionInfra
  jobs:
  - job: TestJob
    displayName: 'Build Package & Run Pytest'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: 'Install dependencies'

    - script: |
        pytest --junitxml=test-results.xml
      displayName: 'Run Pytest'

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFiles: '**/test-results.xml'

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'

# ==========================================
# STAGE 3: DEPLOY TO DEV
# ==========================================
- stage: DeployDev
  displayName: 'Deploy to Dev Environment'
  dependsOn: BuildAndTest
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
  jobs:
  - deployment: DeployDevJob
    environment: 'development'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(devAppName)'
              package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
              runtimeStack: 'PYTHON|3.12'
              startUpCommand: 'gunicorn --bind=0.0.0.0 --timeout 600 app:app'

# ==========================================
# STAGE 4: DEPLOY TO PROD
# ==========================================
- stage: DeployProd
  displayName: 'Deploy to Prod Environment'
  dependsOn: BuildAndTest
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployProdJob
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(prodAppName)'
              package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
              runtimeStack: 'PYTHON|3.12'
              startUpCommand: 'gunicorn --bind=0.0.0.0 --timeout 600 app:app'
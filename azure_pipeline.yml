trigger:
  branches:
    include:
      - dev
      - testing
      - main
  paths:
    exclude:
      - '**.tf'
      - '**.tfvars'
      - '.github/**'
      - 'README.md'

pr:
  branches:
    include:
      - dev
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.12'
  azureServiceConnection: 'Azure-AppService-Conn'
  devAppName: 'app-hr-helpdesk-dev'
  testAppName: 'app-hr-helpdesk-testing'
  prodAppName: 'app-hr-helpdesk-prod'

stages:
# STAGE 1: APPLICATION BUILD & UNIT TESTING
- stage: BuildAndTest
  displayName: 'App Build & Unit Testing'
  jobs:
  - job: TestAndPackageJob
    displayName: 'Run Pytest & Package Application'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: 'Setup Python $(pythonVersion)'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: 'Install Application Dependencies'

    - script: |
        pytest --junitxml=test-results.xml
      displayName: 'Run Pytest Unit Tests'

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFiles: '**/test-results.xml'
      displayName: 'Publish Unit Test Results'

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
      displayName: 'Archive Application Zip Artifact'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
      displayName: 'Publish Build Artifacts'

# STAGE 2: DEPLOY TO DEV ENVIRONMENT
- stage: DeployDev
  displayName: 'Deploy Application to Dev Environment'
  dependsOn: BuildAndTest
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
  jobs:
  - deployment: DeployDevJob
    environment: 'development'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(devAppName)'
              package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'

# STAGE 3: DEPLOY TO TESTING ENVIRONMENT
- stage: DeployTesting
  displayName: 'Deploy Application to Testing Environment'
  dependsOn: BuildAndTest
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/testing'))
  jobs:
  - deployment: DeployTestJob
    environment: 'testing'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(testAppName)'
              package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'

# STAGE 4: DEPLOY TO PRODUCTION ENVIRONMENT
- stage: DeployProd
  displayName: 'Deploy Application to Production Environment'
  dependsOn: BuildAndTest
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployProdJob
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(prodAppName)'
              package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
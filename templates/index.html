<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PavBot — Flask · Azure App Service</title>
<style>
  :root{
    --ink:#0e1a2b; --panel:#132a45; --panel-2:#1b3a5e;
    --azure:#2f9df4; --azure-deep:#0a66c2; --mint:#8ff0d2;
    --paper:#eef5fc; --muted:#7e97b3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--ink) 0%,#123055 100%);
    color:var(--paper); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .shell{width:100%;max-width:560px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .bot-mark{
    width:44px;height:44px;border-radius:12px;flex:none;
    background:linear-gradient(135deg,var(--azure),var(--azure-deep));
    display:grid;place-items:center;font-size:22px;
    box-shadow:0 4px 14px rgba(47,157,244,.35);
  }
  h1{font-size:1.15rem;font-weight:600;letter-spacing:.02em}
  .sub{font-size:.75rem;color:var(--muted)}
  .chat{
    background:var(--panel);border:1px solid rgba(143,240,210,.12);
    border-radius:16px;overflow:hidden;
    display:flex;flex-direction:column;height:70vh;max-height:620px;
  }
  #messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:80%;padding:10px 14px;border-radius:14px;font-size:.92rem;line-height:1.45;animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .bot{background:var(--panel-2);border-bottom-left-radius:4px;align-self:flex-start}
  .user{background:var(--azure-deep);border-bottom-right-radius:4px;align-self:flex-end}
  form,.composer{display:flex;gap:8px;padding:12px;background:rgba(0,0,0,.18)}
  #input{
    flex:1;padding:11px 14px;border-radius:10px;border:1px solid rgba(143,240,210,.15);
    background:var(--ink);color:var(--paper);font-size:.95rem;outline:none;
  }
  #input:focus{border-color:var(--azure)}
  button{
    padding:11px 18px;border:none;border-radius:10px;cursor:pointer;
    background:var(--azure);color:#fff;font-weight:600;font-size:.9rem;
  }
  button:hover{background:var(--azure-deep)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 12px;background:rgba(0,0,0,.18)}
  .chip{
    font-size:.75rem;padding:5px 11px;border-radius:99px;cursor:pointer;
    background:transparent;color:var(--mint);border:1px solid rgba(143,240,210,.35);font-weight:500;
  }
  .chip:hover{background:rgba(143,240,210,.1)}
  footer{margin-top:10px;text-align:center;font-size:.7rem;color:var(--muted)}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="bot-mark">🤖</div>
    <div>
      <h1>PavBot</h1>
      <div class="sub">Flask · Azure App Service · Azure AI Foundry</div>
    </div>
  </header>

  <div class="chat">
    <div id="messages">
      <div class="msg bot">Hi! I'm PavBot. Try one of the chips below or type a message.</div>
    </div>
    <div class="chips">
      <button class="chip" onclick="quick('Who are you and where are you running?')">who are you</button>
      <button class="chip" onclick="quick('Explain CI/CD in two lines')">explain ci/cd</button>
      <button class="chip" onclick="quick('Tell me a DevOps joke')">joke</button>
      <button class="chip" onclick="quick('Summarize what Azure AI Foundry is')">foundry</button>
    </div>
    <div class="composer">
      <input id="input" placeholder="Type a message…" autocomplete="off"
             onkeydown="if(event.key==='Enter')send()">
      <button onclick="send()">Send</button>
    </div>
  </div>

  <footer>Deployed via GitHub → Azure App Service (Deployment Center, portal CI/CD)</footer>
</div>

<script>
const messages = document.getElementById('messages');
const input = document.getElementById('input');
const history = [];   // [{role, content}] sent to the backend for context

function add(text, cls){
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

function quick(text){ input.value = text; send(); }

async function send(){
  const text = input.value.trim();
  if(!text) return;
  add(text, 'user');
  input.value = '';
  const typing = add('…thinking', 'bot');
  try{
    const res = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message: text, history: history})
    });
    const data = await res.json();
    typing.textContent = data.reply;
    history.push({role:'user', content:text});
    history.push({role:'assistant', content:data.reply});
  }catch(e){
    typing.textContent = 'Server unreachable — is the app running?';
  }
}
</script>
</body>
</html>

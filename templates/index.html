<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent - Azure Testing Ground</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --button-hover: #0284c7;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 8px;
            color: var(--accent-color);
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        textarea {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            padding: 12px;
            font-size: 0.95rem;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        textarea:focus {
            outline: 2px solid var(--accent-color);
            border-color: transparent;
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: var(--button-hover);
        }

        .response-box {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            min-height: 60px;
            font-size: 0.95rem;
            white-space: pre-wrap;
            color: #e2e8f0;
        }

        .loading {
            color: #94a3b8;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🤖 AI Agent Workspace</h1>
        <p class="subtitle">CI/CD Azure Pipeline Testing Ground</p>

        <div class="form-group">
            <textarea id="promptInput" placeholder="Enter your message for the AI agent..."></textarea>
            <button onclick="sendPrompt()">Send Prompt</button>
        </div>

        <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 8px;">Agent Response:</label>
        <div id="responseBox" class="response-box">
            <span class="loading">Waiting for input...</span>
        </div>
    </div>

    <script>
        async function sendPrompt() {
            const promptInput = document.getElementById('promptInput').value;
            const responseBox = document.getElementById('responseBox');

            if (!promptInput.trim()) {
                responseBox.innerText = "Please enter a message.";
                return;
            }

            responseBox.innerHTML = '<span class="loading">Processing...</span>';

            try {
                const res = await fetch('/api/agent', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt: promptInput }),
                });

                const data = await res.json();
                responseBox.innerText = data.response || JSON.stringify(data);
            } catch (err) {
                responseBox.innerText = "Error communicating with AI Agent API.";
                console.error(err);
            }
        }
    </script>

</body>
</html>
